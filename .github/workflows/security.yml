name: Security & Quality Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: NPM Audit
        run: npm audit --audit-level=high

      - name: Run Linter
        run: npm run lint --if-present

      # Placeholder for SAST tools like SonarQube or CodeQL
      - name: SAST Placeholder
        run: echo "Running SAST analysis..."
