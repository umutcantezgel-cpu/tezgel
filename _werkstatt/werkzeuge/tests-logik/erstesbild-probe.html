<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probe Erstes Bild</title>
<style>
  /* Positivprobe für erstesbild.mjs --probe (m390, 390 × 844). Bekannte Lage, ohne Server:
     logo ok · ueberschrift ok · ort ok · hauptknopf unter dem Falz · kontakt von einem festen Element verdeckt. */
  html, body { margin: 0; padding: 0; font-family: sans-serif; font-size: 16px; background: #fff; color: #111; }
  body { min-height: 844px; position: relative; }
  header { height: 64px; }
  header img { display: block; width: 120px; height: 40px; margin: 12px 16px; background: #c96; }
  main { position: absolute; top: 96px; left: 16px; right: 16px; }
  h1 { margin: 0 0 8px; font-size: 26px; line-height: 32px; }
  .ort { margin: 0; line-height: 20px; }
  .knopf { display: block; margin-top: 2000px; min-height: 44px; line-height: 44px; padding: 0 12px; background: #264; color: #fff; text-decoration: none; }
  .tel { position: absolute; top: 200px; left: 16px; width: 140px; height: 44px; line-height: 44px; color: #111; }
  .deckel { position: fixed; top: 200px; left: 16px; width: 140px; height: 44px; background: #fff; z-index: 10; }
</style>
</head>
<body>
<header>
  <a href="/"><img alt="Tezgel Logo" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw=="></a>
</header>
<main>
  <h1>Badsanierung ohne Stufe</h1>
  <p class="ort">Fliesenlegerbetrieb in Aßlar</p>
  <a class="knopf" data-erstes-bild="hauptknopf" href="/anfrage">Termin anfragen</a>
</main>
<a class="tel" href="tel:+4900000000">Anrufen</a>
<div class="deckel"></div>
</body>
</html>
